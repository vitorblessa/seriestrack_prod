name: Android Debug APK

# Builds an UNSIGNED debug APK for quick manual installs/testing (e.g. trying
# out native FCM push). No keystore secrets needed — Gradle signs debug
# builds with Android's built-in shared debug key automatically.
#
# NOT for the Play Store (use android-release.yml for that, which produces a
# signed .aab). This is purely a "get an installable APK fast" button.
#
# Trigger: manual only, from the Actions tab.
#
# The APK is available at:
#   Actions → this run → Artifacts → seriestrack-debug-apk

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Single line, space-separated — a YAML `|` block here gets passed
          # to sdkmanager with embedded newlines as ONE unparseable package
          # name instead of being split, and the install fails with "Failed
          # to find package 'platforms;android-36\nbuild-tools...'".
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install web deps
        working-directory: frontend
        run: npm ci

      - name: Build web bundle
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL || 'https://seriestrack-backend-zfla.onrender.com' }}
          CI: 'true'
        run: npm run build

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      - name: Gradle assembleDebug
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: seriestrack-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
