name: Android Release Build

# Builds a signed Android App Bundle (.aab) and uploads it as a workflow artifact.
#
# Triggers:
#   1. Pushing a version tag (v1.0.0, v1.2.3, etc.)  → automatic release build
#   2. Manual dispatch from the Actions tab           → on-demand build with custom version
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#
#   ANDROID_KEYSTORE_BASE64      Base64 of your seriestrack-release.jks
#                                (generate: base64 -w0 seriestrack-release.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD    Keystore password
#   ANDROID_KEY_ALIAS            Key alias inside the keystore (e.g. "seriestrack")
#   ANDROID_KEY_PASSWORD         Password for the specific alias
#   REACT_APP_BACKEND_URL        Production backend URL (e.g. https://show-notify.emergent.host)
#
# Optional (for automatic Play Console upload — see final job):
#   PLAY_SERVICE_ACCOUNT_JSON    Play Console API service account key JSON
#
# The AAB is available at:
#   Actions → this run → Artifacts → seriestrack-release-aab

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name to embed (e.g. 1.0.1). Leave blank to use gradle default.'
        required: false
      versionCode:
        description: 'Version code (integer, must be higher than previous release).'
        required: false

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      # ------------------------------------------------------------------
      # Toolchain
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0
            platform-tools

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------------
      # Version bump (if manually triggered with inputs)
      # ------------------------------------------------------------------
      - name: Apply version overrides
        if: github.event_name == 'workflow_dispatch' && (inputs.versionName != '' || inputs.versionCode != '')
        working-directory: frontend/android/app
        run: |
          if [ -n "${{ inputs.versionName }}" ]; then
            sed -i "s/versionName \".*\"/versionName \"${{ inputs.versionName }}\"/" build.gradle
          fi
          if [ -n "${{ inputs.versionCode }}" ]; then
            sed -i "s/versionCode [0-9]\+/versionCode ${{ inputs.versionCode }}/" build.gradle
          fi
          echo "--- current versioning ---"
          grep -E 'versionName|versionCode' build.gradle

      # ------------------------------------------------------------------
      # Web build (React → build/)
      # ------------------------------------------------------------------
      - name: Install web deps
        working-directory: frontend
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build web bundle
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          CI: 'true'
        run: |
          if [ -z "$REACT_APP_BACKEND_URL" ]; then
            echo "::error::REACT_APP_BACKEND_URL secret is missing — refusing to build with an empty backend URL."
            exit 1
          fi
          yarn build

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      # ------------------------------------------------------------------
      # Signing keystore
      # ------------------------------------------------------------------
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo -n "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          # Sanity-check keystore format so we fail fast with a readable error.
          keytool -list -keystore "$RUNNER_TEMP/keystore/release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null

      # ------------------------------------------------------------------
      # Gradle release
      # ------------------------------------------------------------------
      - name: Gradle bundleRelease
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --no-daemon --stacktrace

      # ------------------------------------------------------------------
      # Artifact
      # ------------------------------------------------------------------
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: seriestrack-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload mapping.txt (R8 deobfuscation)
        uses: actions/upload-artifact@v4
        with:
          name: seriestrack-mapping
          path: frontend/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

  # ----------------------------------------------------------------------
  # Optional: publish directly to Play Console (Internal testing track).
  # Only runs on tag pushes. Add PLAY_SERVICE_ACCOUNT_JSON to enable.
  # See: https://developers.google.com/android-publisher/getting_started
  # ----------------------------------------------------------------------
  publish:
    name: Publish to Play Console (internal)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: seriestrack-release-aab

      - name: Upload to Play Console
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vitorblessa.seriestrack
          releaseFiles: app-release.aab
          track: internal
          status: draft
          releaseName: ${{ github.ref_name }}
