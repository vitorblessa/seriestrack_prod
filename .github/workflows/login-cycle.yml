name: SeriesTrack login cycle

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (UTC)
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

concurrency:
  group: series-track-login
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Login + logout
        env:
          ST_EMAIL: ${{ secrets.ST_EMAIL }}
          ST_PASSWORD: ${{ secrets.ST_PASSWORD }}
        run: python login_cycle.py

      - name: Guardar screenshot em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erro-screenshot
          path: erro.png
          if-no-files-found: ignore
