services:
  - type: web
    name: seriestrack-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: seriestrack
      - key: JWT_SECRET
        generateValue: true
      - key: TMDB_READ_TOKEN
        sync: false
      - key: TMDB_REGION
        value: BR
      - key: TMDB_LANG
        value: pt-BR
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 915970909757-v0heesi45pik9a10evd6ei27nvspcdan.apps.googleusercontent.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PRO_OWNERS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_MODE
        value: test
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_PEM_PATH
        sync: false
      - key: VAPID_SUBJECT
        sync: false
